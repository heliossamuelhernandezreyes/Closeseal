name: Nexo ARCONT Repair Loop

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned ARCONT diagnosis and execution stack
        uses: actions/checkout@v4
        with:
          repository: heliossamuelhernandezreyes/Arcont
          ref: 5d5d09b516374782ecd5df5ae112f53b1a9d21f3
          path: .arcont-agent
      - name: Install exact Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 unzip
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Inject, diagnose, repair and replay Nexo
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/nexo_repair_loop_acceptance.py \
            --arcont .arcont-agent \
            --stage /tmp/nexo-repair-stage \
            --evidence "$PWD/nexo-repair-evidence"
      - name: Preserve repair-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-arcont-repair-loop-${{ github.sha }}
          path: nexo-repair-evidence/
          include-hidden-files: true
          retention-days: 30
