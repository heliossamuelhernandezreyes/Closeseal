name: Nexo Shooter Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shooter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: heliossamuelhernandezreyes/Arcont
          ref: 4930d4521380535e1d6bb81c4231a5f23d711c09
          path: .arcont-tools
      - name: Install exact Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 unzip
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Stage and import separate shooter
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          python -m unittest discover -s tests -p 'test_shooter_build.py'
          python tools/verify_shooter_assets.py
          python tools/verify_shooter_sector.py
          python tools/prepare_shooter.py --stage /tmp/nexo-shooter
          "$GODOT_BIN" --headless --path /tmp/nexo-shooter --editor --import > shooter-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' shooter-import.log; then exit 1; fi
          python tools/configure_shooter_imports.py --stage /tmp/nexo-shooter
          "$GODOT_BIN" --headless --path /tmp/nexo-shooter --editor --import > shooter-mipmap-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' shooter-mipmap-import.log; then exit 1; fi
      - name: Bake authored world collision and run real-engine acceptance
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path /tmp/nexo-shooter --script res://tools/shooter_bake.gd 2>&1 | tee shooter-bake.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-acceptance.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_mobility_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-mobility.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_slice_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-slice.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_visual_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-visual.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_finish_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-finish.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_presentation_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-presentation.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --audio-driver Dummy --path /tmp/nexo-shooter --script res://tools/shooter_combat_polish_acceptance.gd -- --captures="$PWD/shooter-evidence" 2>&1 | tee shooter-combat-polish.log
          python .arcont-tools/tools/production_toolchain.py finish shooter-evidence/finish-record.json > shooter-evidence/arcont-finish-review.json
          python .arcont-tools/tools/production_toolchain.py audio assets/shooter/audio/banks/bank.json --project . --directory assets/shooter/audio/banks > shooter-evidence/audio-review.json
          python tools/shooter_motion_smoke.py --arcont .arcont-tools --project /tmp/nexo-shooter
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' shooter-bake.log shooter-acceptance.log shooter-mobility.log shooter-slice.log shooter-visual.log shooter-finish.log shooter-presentation.log shooter-combat-polish.log; then exit 1; fi
          python -c 'import json; r=json.load(open("shooter-evidence/acceptance.json")); assert r["ok"],r["failures"]'
      - name: Replay real third-person player through ARCONT
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          python tools/shooter_authoring_smoke.py --arcont .arcont-tools --project /tmp/nexo-shooter
          cp /tmp/nexo-shooter/.arcont/shooter-authoring-smoke.json shooter-evidence/
      - name: Validate production assets, animation and tactical-sector reviews
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          python -c 'import json,subprocess; lock=json.load(open("arcont-production.lock.json")); assert subprocess.check_output(["git","-C",".arcont-tools","rev-parse","HEAD"],text=True).strip()==lock["commit"]'
          python .arcont-tools/tools/production_toolchain.py doctor
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/shooter_production_smoke.py --arcont .arcont-tools --project /tmp/nexo-shooter
      - name: Collect production review project outputs
        if: always()
        run: |
          mkdir -p shooter-evidence/production-project/.arcont shooter-evidence/production-project/assets
          for directory in production-evidence runs; do
            if [ -d "/tmp/nexo-shooter/.arcont/$directory" ]; then
              cp -r "/tmp/nexo-shooter/.arcont/$directory" shooter-evidence/production-project/.arcont/
            fi
          done
          if [ -d /tmp/nexo-shooter/assets/production_candidates ]; then
            cp -r /tmp/nexo-shooter/assets/production_candidates shooter-evidence/production-project/assets/
          fi
      - name: Preserve acceptance captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-shooter-${{ github.sha }}
          path: |
            shooter-import.log
            shooter-mipmap-import.log
            shooter-bake.log
            shooter-acceptance.log
            shooter-mobility.log
            shooter-slice.log
            shooter-visual.log
            shooter-finish.log
            shooter-presentation.log
            shooter-combat-polish.log
            shooter-evidence/
          include-hidden-files: true
          retention-days: 30
