name: Urban Nexo Map
on:
  pull_request:
    branches: [map-forge/editor-control-world-3d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  urban:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and inventory official Arcont catalogue selections
        run: |
          python tools/urban_asset_inventory.py
          python tools/prepare_urban_assets.py urban-source-packs
      - uses: actions/upload-artifact@v4
        with:
          name: urban-source-packs
          path: |
            urban-source-packs/
            assets/urban/
          retention-days: 30
